services:
  - type: web
    name: fantasy-ipl-auction-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CRICAPI_KEY
        sync: false
      - key: CRICAPI_SYNC_INTERVAL_MINUTES
        value: 30
      - key: DATA_DIR
        value: /opt/render/project/data
    disk:
      name: fantasy-db
      mountPath: /opt/render/project/data
      sizeGB: 1

  - type: web
    name: fantasy-ipl-auction-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fantasy-ipl-auction-backend.onrender.com
